[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workerbee-security"
version = "0.1.0"
description = "Turn Cowrie honeypot logs into analyst-ready incident reports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
workerbee = "workerbee_security.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workerbee_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
