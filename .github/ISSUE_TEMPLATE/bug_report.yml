name: Bug report
description: Report an incorrect result or unexpected failure
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, public IP addresses, and captured payloads before posting logs.
  - type: input
    id: version
    attributes:
      label: WorkerBee version
      placeholder: workerbee 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Sanitized sample event
      render: json
